[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "0.2.0"
description = "LLM-assisted spec drift & compliance checker for Ethereum specs/clients that runs in CI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="SpecGuard Contributors"}]
dependencies = [
  "click>=8.1.7",
  "pydantic>=2.6",
  "requests>=2.31",
  "pyyaml>=6.0.1",
  "rich>=13.7",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.8",
  "types-requests>=2.31.0.20240106",
]

[project.scripts]
specguard = "specguard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
